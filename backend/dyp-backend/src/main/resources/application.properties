# ==========================================
# DYP Backend Configuration
# ==========================================

# Application
spring.application.name=dyp-backend

# ==========================================
# PostgreSQL Database
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/dyp_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Server
# ==========================================

server.port=8080

dyp.security.jwt-secret=${JWT_SECRET}

# ==========================================
# CORS - Frontend Origin
# ==========================================
# Configurable origin for the React frontend.
# Override with DYP_FRONTEND_ORIGIN environment variable.
# Default: http://localhost:5173 (Vite dev server)
dyp.frontend.origin=${DYP_FRONTEND_ORIGIN:http://localhost:5173}
