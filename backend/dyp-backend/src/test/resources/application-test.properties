# Test profile configuration
# These values are ONLY used during test execution (mvnw test)
# Production uses environment variables: JWT_SECRET and DB_PASSWORD

# JWT secret for testing (test-only, not production)
dyp.security.jwt-secret=test-jwt-secret-key-for-testing-purposes-only-min-32-chars

# Database connection for testing
# Uses the same PostgreSQL instance but with test credentials
spring.datasource.url=jdbc:postgresql://localhost:5432/dyp_db
spring.datasource.username=postgres
spring.datasource.password=test

# CORS frontend origin for testing
dyp.frontend.origin=http://localhost:5173
